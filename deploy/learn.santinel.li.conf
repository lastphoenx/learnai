# ============================================================
# LearnAI – learn.santinel.li
# CT 108 (nginx) → CT 135 (192.168.131.45:3000)
#
# Kopie der kanonischen Datei:
#   doku/pve2/vm/135-learnai/learn.santinel.li.conf
# ============================================================

server {
    listen 80;
    server_name learn.santinel.li;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /etc/nginx/renew-ssl/www;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name learn.santinel.li;

    access_log /var/log/nginx/learn.santinel.li.access.log main;
    error_log  /var/log/nginx/learn.santinel.li.error.log warn;

    ssl_certificate     /etc/letsencrypt/live/learn.santinel.li/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.santinel.li/privkey.pem;

    include snippets/ssl-hardening-ecdsa.conf;
    include snippets/security-headers.conf;

    client_max_body_size 50m;

    location / {
        proxy_pass         http://192.168.131.45:3000;
        include            snippets/proxy-headers.conf;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
