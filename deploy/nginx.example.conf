# ============================================================
# LearnAI — nginx example (generic)
# Replace APP_DOMAIN, APP_UPSTREAM_API, APP_UPSTREAM_FRONTEND.
# Production-specific configs belong in private ops documentation only.
# ============================================================

server {
    listen 80;
    server_name APP_DOMAIN;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name APP_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_DOMAIN/privkey.pem;

    client_max_body_size 50m;

    # Route API directly to FastAPI for correct client IP (X-Real-IP)
    location /api/ {
        proxy_pass         http://APP_UPSTREAM_API:8000;
        include            /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass         http://APP_UPSTREAM_FRONTEND:3000;
        include            /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
